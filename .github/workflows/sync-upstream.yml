name: Full Sync All Branches

on:
  # 定时任务：每6小时运行一次
  schedule:
    - cron: '35 16 * * *'
  # 手动触发：允许你随时在Actions页面上手动启动
  workflow_dispatch:

jobs:
  full-sync:
    runs-on: ubuntu-latest
    steps:
      # 第一步：检出你的仓库，fetch-depth: 0 确保获取完整的提交历史
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 第二步：将上游仓库添加为远程仓库，别名定为 'upstream'
      - name: Add upstream remote
        run: git remote add upstream https://github.com/NousResearch/hermes-agent.git

      # 第三步：从上游仓库获取所有分支、标签，并清理已不存在的远程引用
      - name: Fetch all upstream branches and tags
        run: git fetch upstream --prune --tags

      # 第四步：强制推送所有分支到你的仓库（origin），完成同步
      - name: Push all branches (force mirror)
        run: git push origin --force --all

      # 第五步：强制推送所有标签到你的仓库
      - name: Push all tags (force mirror)
        run: git push origin --force --tags
